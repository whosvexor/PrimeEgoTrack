<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Ego - Cards, Rules & Lore</title>

  <!-- Excel Parser Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0b12;
      --card-bg: #161522;
      --card-border: #28263c;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-purple: #7c3aed;
      --badge-purple-bg: #2e185b;
      --badge-purple-text: #c084fc;
      --buff-color: #10b981;
      --bane-color: #ef4444;
      --trigger-bg: #1e1b4b;
      --trigger-text: #a5b4fc;
      --stats-bg: #0e0d17;
      --input-bg: #161522;
    }

    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: #d1d5db;
      --text-main: #111827;
      --text-sub: #4b5563;
      --badge-purple-bg: #f3e8ff;
      --badge-purple-text: #7e22ce;
      --trigger-bg: #e0e7ff;
      --trigger-text: #3730a3;
      --stats-bg: #f9fafb;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; transition: background 0.2s, color 0.2s; }

    header { max-width: 1200px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }

    .tab-nav { max-width: 1200px; margin: 0 auto 24px; display: flex; gap: 8px; border-bottom: 2px solid var(--card-border); padding-bottom: 8px; }
    .tab-btn {
      background: none; border: none; color: var(--text-sub); font-size: 1rem; font-weight: 600;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text-main); background-color: var(--card-bg); }
    .tab-btn.active { color: #fff; background-color: var(--accent-purple); }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      background-color: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
      padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent-purple); }
    .btn-primary { background: var(--accent-purple); border: none; color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: #991b1b; border: none; color: #fff; }
    #fileInput { display: none; }

    .controls { max-width: 1200px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    input[type="text"], input[type="email"], input[type="password"], select {
      background-color: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main);
      padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    input[type="text"] { flex: 1; min-width: 200px; }
    input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, select:focus { border-color: var(--accent-purple); }

    .tab-content { display: none; max-width: 1200px; margin: 0 auto; }
    .tab-content.active { display: block; }

    .doc-frame {
      width: 100%; height: 800px; border-radius: 12px; border: 1px solid var(--card-border);
      background: #ffffff;
    }

    .doc-admin-bar { background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; gap: 10px; align-items: center; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

    .card {
      background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent-purple); }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .type-badge {
      background-color: var(--badge-purple-bg); color: var(--badge-purple-text);
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px;
    }
    .collection-num { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }
    .card-title { font-size: 1.3rem; font-weight: 700; color: var(--text-main); word-break: break-word; }

    .badges-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .sub-badge { font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
    .trigger-badge { background-color: var(--trigger-bg); color: var(--trigger-text); border: 1px solid var(--card-border); }
    .attr-badge { background-color: var(--stats-bg); color: var(--text-sub); border: 1px solid var(--card-border); }

    .stats-row { display: flex; gap: 12px; background: var(--stats-bg); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--card-border); }
    .stat-item { display: flex; gap: 4px; color: var(--text-main); }
    .stat-label { color: var(--text-sub); }

    .card-ability { font-size: 0.92rem; line-height: 1.5; color: var(--text-main); padding-top: 4px; border-top: 1px solid var(--card-border); }
    .buff-tag { color: var(--buff-color); font-weight: 700; }
    .bane-tag { color: var(--bane-color); font-weight: 700; }

    .empty-state { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-sub); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal {
      background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 12px;
      width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px;
    }
    .modal h2 { font-size: 1.3rem; color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <h1>Prime Ego Portal</h1>
    <div class="header-actions">
      <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
      <label class="btn btn-primary" id="uploadBtn" style="display: none;">
        📁 Upload Cards Excel
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
      </label>
      <button class="btn" id="adminBtn" onclick="toggleAdminModal()">🔒 Admin Login</button>
    </div>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('cardsTab', this)">🎴 Card Tracker</button>
    <button class="tab-btn" onclick="switchTab('rulesTab', this)">📜 Rules</button>
    <button class="tab-btn" onclick="switchTab('loreTab', this)">📖 Lore</button>
  </div>

  <div id="cardsTab" class="tab-content active">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by name or ability..." />
      <select id="sortSelect">
        <option value="default">Sort: Default (# Collection)</option>
        <option value="cost-asc">Cost: Low to High</option>
        <option value="cost-desc">Cost: High to Low</option>
        <option value="hp-asc">HP: Low to High</option>
        <option value="hp-desc">HP: High to Low</option>
        <option value="power-asc">Power: Low to High</option>
        <option value="power-desc">Power: High to Low</option>
        <option value="name-asc">Name: A - Z</option>
      </select>
      <select id="setFilter"><option value="ALL">All Sets</option></select>
      <select id="typeFilter"><option value="ALL">All Types</option></select>
      <select id="tagFilter"><option value="ALL">All Triggers / Tags</option></select>
    </div>
    <div class="gallery" id="cardGallery">
      <div class="empty-state">Connecting to Realtime Database...</div>
    </div>
  </div>

  <div id="rulesTab" class="tab-content">
    <div class="doc-admin-bar" id="rulesAdminBar">
      <input type="text" id="rulesUrlInput" placeholder="Paste Google Doc share link..." />
      <button class="btn btn-primary" onclick="updateDocUrl('rules')">Save Rules Link</button>
    </div>
    <iframe id="rulesFrame" class="doc-frame" src="about:blank"></iframe>
  </div>

  <div id="loreTab" class="tab-content">
    <div class="doc-admin-bar" id="loreAdminBar">
      <input type="text" id="loreUrlInput" placeholder="Paste Google Doc share link..." />
      <button class="btn btn-primary" onclick="updateDocUrl('lore')">Save Lore Link</button>
    </div>
    <iframe id="loreFrame" class="doc-frame" src="about:blank"></iframe>
  </div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h2>Admin Authentication</h2>
      <input type="email" id="adminEmail" placeholder="Admin Email" />
      <input type="password" id="adminPassword" placeholder="Admin Password" />
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn" onclick="closeAdminModal()">Cancel</button>
        <button class="btn btn-primary" onclick="checkAdminCredentials()">Login</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhGXBgEcVDihD3od5XGJB7mmBg7_Kxwt4",
      authDomain: "pego-a3b20.firebaseapp.com",
      databaseURL: "https://pego-a3b20-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pego-a3b20",
      storageBucket: "pego-a3b20.firebasestorage.app",
      messagingSenderId: "895990371588",
      appId: "1:895990371588:web:319ca9c8bbfc46f8db2c51"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    let cardDatabase = [];
    let currentUser = null;

    // Theme Management
    window.toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      document.getElementById('themeBtn').textContent = target === 'light' ? '☀️ Light' : '🌙 Dark';
    };

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '☀️ Light' : '🌙 Dark';

    // Google Doc Preview Link Cleaner (Fixes Option 2 kix layout bug)
    function cleanGoogleDocUrl(url) {
      if (!url) return 'about:blank';
      const match = url.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://docs.google.com/document/d/${match[1]}/preview`;
      }
      return url.trim();
    }

    function getCardSortKeys(card) {
      const val = card.Collection_Number;
      if (!val || String(val).toLowerCase() === 'nan') {
        return { setTotal: 99999, cardNum: 99999 };
      }
      
      let str = String(val).replace(/^#/, '').trim();
      let cardNum = 99999;
      let setTotal = 99999;

      if (str.includes('/')) {
        const parts = str.split('/');
        cardNum = parseInt(parts[0].trim(), 10) || 99999;
        setTotal = parseInt(parts[1].trim(), 10) || 99999;
      } else {
        cardNum = parseInt(str, 10) || 99999;
      }

      return { setTotal, cardNum };
    }

    function compareCardsDefault(a, b) {
      const keyA = getCardSortKeys(a);
      const keyB = getCardSortKeys(b);

      if (keyA.setTotal !== keyB.setTotal) {
        return keyA.setTotal - keyB.setTotal;
      }
      return keyA.cardNum - keyB.cardNum;
    }

    function parseNumericStat(val) {
      if (val === undefined || val === null || val === '' || isNaN(val)) return -Infinity;
      return Number(val);
    }

    function sortCardsList(cards, sortOption) {
      return cards.sort((a, b) => {
        if (sortOption === 'default') {
          return compareCardsDefault(a, b);
        }

        if (sortOption === 'cost-asc') return parseNumericStat(a.Cost) - parseNumericStat(b.Cost);
        if (sortOption === 'cost-desc') return parseNumericStat(b.Cost) - parseNumericStat(a.Cost);

        if (sortOption === 'hp-asc') return parseNumericStat(a.HP) - parseNumericStat(b.HP);
        if (sortOption === 'hp-desc') return parseNumericStat(b.HP) - parseNumericStat(a.HP);

        if (sortOption === 'power-asc') return parseNumericStat(a.Power) - parseNumericStat(b.Power);
        if (sortOption === 'power-desc') return parseNumericStat(b.Power) - parseNumericStat(a.Power);

        if (sortOption === 'name-asc') {
          return (a.Name || '').localeCompare(b.Name || '');
        }

        return 0;
      });
    }

    function formatCollectionNum(val) {
      if (val === undefined || val === null || val === '' || String(val).toLowerCase() === 'nan') {
        return '---';
      }
      let str = String(val).trim();
      if (str.startsWith('#')) str = str.substring(1).trim();

      if (str.includes('/')) {
        const parts = str.split('/');
        const num = parts[0].trim();
        const total = parts[1] ? parts[1].trim() : '';
        const paddedNum = /^\d+$/.test(num) ? num.padStart(3, '0') : num;
        return total ? `${paddedNum}/${total}` : paddedNum;
      }

      if (/^\d+$/.test(str)) return str.padStart(3, '0');
      return str;
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const uploadBtn = document.getElementById('uploadBtn');
      const rulesAdminBar = document.getElementById('rulesAdminBar');
      const loreAdminBar = document.getElementById('loreAdminBar');
      const adminBtn = document.getElementById('adminBtn');

      if (user && !user.isAnonymous) {
        uploadBtn.style.display = 'inline-flex';
        rulesAdminBar.style.display = 'flex';
        loreAdminBar.style.display = 'flex';
        adminBtn.textContent = '🔓 Logout Admin';
        adminBtn.classList.add('btn-danger');
      } else {
        uploadBtn.style.display = 'none';
        rulesAdminBar.style.display = 'none';
        loreAdminBar.style.display = 'none';
        adminBtn.textContent = '🔒 Admin Login';
        adminBtn.classList.remove('btn-danger');
      }
    });

    function listenToRealtimeData() {
      const cardsRef = ref(db, 'portal/cards');
      onValue(cardsRef, (snapshot) => {
        const data = snapshot.val();
        if (data && Array.isArray(data)) {
          cardDatabase = data;
          populateFilterDropdowns(cardDatabase);
          filterCards();
        } else {
          document.getElementById('cardGallery').innerHTML = '<div class="empty-state">No card database found in Realtime Database. Admin can upload Excel file.</div>';
        }
      }, (error) => {
        console.error("Database read error: ", error);
        document.getElementById('cardGallery').innerHTML = `<div class="empty-state">Database Connection Error: ${error.message}</div>`;
      });

      const settingsRef = ref(db, 'portal/settings');
      onValue(settingsRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (data.rulesUrl) {
            document.getElementById('rulesUrlInput').value = data.rulesUrl;
            document.getElementById('rulesFrame').src = cleanGoogleDocUrl(data.rulesUrl);
          }
          if (data.loreUrl) {
            document.getElementById('loreUrlInput').value = data.loreUrl;
            document.getElementById('loreFrame').src = cleanGoogleDocUrl(data.loreUrl);
          }
        }
      });
    }

    window.switchTab = function(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
      localStorage.setItem('activeTab', tabId);
    };

    function formatAbilityText(text) {
      if (!text) return "<em>No ability text</em>";
      let str = String(text).replace(/\\/g, ' ');

      if (/Buff\s*\/\s*Bane:/i.test(str)) {
        str = str.replace(
          /Buff\s*\/\s*Bane:/i,
          '<span class="buff-tag">Buff</span> / <span class="bane-tag">Bane:</span>'
        );
      } else {
        str = str
          .replace(/Buff:/i, '<span class="buff-tag">Buff:</span>')
          .replace(/Bane:/i, '<br><span class="bane-tag">Bane:</span>');
      }
      return str;
    }

    function renderCards(cards) {
      const gallery = document.getElementById('cardGallery');
      gallery.innerHTML = '';

      if (cards.length === 0) {
        gallery.innerHTML = '<div class="empty-state">No matching cards found.</div>';
        return;
      }

      cards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';

        let badgesHtml = '';
        if (card.TAG && String(card.TAG).trim() !== '' && String(card.TAG).toLowerCase() !== 'nan') {
          badgesHtml += `<span class="sub-badge trigger-badge">⚡ ${card.TAG}</span>`;
        } else if (card.Type === 'Domain') {
          badgesHtml += `<span class="sub-badge trigger-badge">🌌 Domain Card (Buff / Bane)</span>`;
        }

        if (card.Attribute1 && String(card.Attribute1).toLowerCase() !== 'nan') {
          badgesHtml += `<span class="sub-badge attr-badge">${card.Attribute1}</span>`;
        }
        if (card.Attribute2 && String(card.Attribute2).toLowerCase() !== 'nan') {
          badgesHtml += `<span class="sub-badge attr-badge">${card.Attribute2}</span>`;
        }

        let statsHtml = '';
        if (card.Type !== 'Domain' && (card.Cost !== undefined || card.HP !== undefined || card.Power !== undefined)) {
          statsHtml = `
            <div class="stats-row">
              ${card.Cost !== undefined ? `<div class="stat-item"><span class="stat-label">Cost:</span> ${card.Cost}</div>` : ''}
              ${card.HP !== undefined ? `<div class="stat-item"><span class="stat-label">HP:</span> ${card.HP}</div>` : ''}
              ${card.Power !== undefined ? `<div class="stat-item"><span class="stat-label">Power:</span> ${card.Power}</div>` : ''}
            </div>
          `;
        }

        const formattedNum = formatCollectionNum(card.Collection_Number);

        cardEl.innerHTML = `
          <div class="card-header">
            <span class="type-badge">${card.Type || 'CARD'}</span>
            <span class="collection-num">#${formattedNum}</span>
          </div>
          <div class="card-title">${card.Name || 'Untitled'}</div>
          ${badgesHtml ? `<div class="badges-row">${badgesHtml}</div>` : ''}
          ${statsHtml}
          <div class="card-ability">${formatAbilityText(card.Ability)}</div>
        `;

        gallery.appendChild(cardEl);
      });
    }

    function populateFilterDropdowns(cards) {
      const setFilter = document.getElementById('setFilter');
      const typeFilter = document.getElementById('typeFilter');
      const tagFilter = document.getElementById('tagFilter');

      const sets = new Set();
      const types = new Set();
      const tags = new Set();

      cards.forEach(c => {
        const keys = getCardSortKeys(c);
        if (keys.setTotal !== 99999) sets.add(`/${keys.setTotal}`);
        if (c.Type) types.add(c.Type);
        if (c.TAG && String(c.TAG).toLowerCase() !== 'nan') tags.add(c.TAG);
      });

      setFilter.innerHTML = '<option value="ALL">All Sets</option>';
      Array.from(sets).sort().forEach(s => setFilter.innerHTML += `<option value="${s}">Set (${s})</option>`);

      typeFilter.innerHTML = '<option value="ALL">All Types</option>';
      types.forEach(t => typeFilter.innerHTML += `<option value="${t}">${t}</option>`);

      tagFilter.innerHTML = '<option value="ALL">All Triggers / Tags</option>';
      tags.forEach(tg => tagFilter.innerHTML += `<option value="${tg}">${tg}</option>`);
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedSet = document.getElementById('setFilter').value;
      const selectedType = document.getElementById('typeFilter').value;
      const selectedTag = document.getElementById('tagFilter').value;
      const sortOption = document.getElementById('sortSelect').value;

      let filtered = cardDatabase.filter(card => {
        const matchQuery = (card.Name && card.Name.toLowerCase().includes(query)) ||
                           (card.Ability && card.Ability.toLowerCase().includes(query));
        const matchSet = selectedSet === 'ALL' || String(card.Collection_Number).includes(selectedSet);
        const matchType = selectedType === 'ALL' || card.Type === selectedType;
        const matchTag = selectedTag === 'ALL' || card.TAG === selectedTag;

        return matchQuery && matchSet && matchType && matchTag;
      });

      filtered = sortCardsList(filtered, sortOption);
      renderCards(filtered);
    }

    window.closeAdminModal = function() {
      document.getElementById('loginModal').style.display = 'none';
    };

    window.toggleAdminModal = function() {
      if (currentUser && !currentUser.isAnonymous) {
        signOut(auth).then(() => alert('Admin logged out.'));
      } else {
        const modal = document.getElementById('loginModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      }
    };

    window.checkAdminCredentials = function() {
      const email = document.getElementById('adminEmail').value.trim();
      const pwd = document.getElementById('adminPassword').value;

      signInWithEmailAndPassword(auth, email, pwd)
        .then(() => {
          alert('Admin authenticated successfully!');
          document.getElementById('adminEmail').value = '';
          document.getElementById('adminPassword').value = '';
          window.closeAdminModal();
        })
        .catch(err => alert('Authentication Failed: ' + err.message));
    };

    window.updateDocUrl = function(type) {
      if (!currentUser || currentUser.isAnonymous) return;
      const field = type === 'rules' ? 'rulesUrl' : 'loreUrl';
      const inputId = type === 'rules' ? 'rulesUrlInput' : 'loreUrlInput';
      const rawUrl = document.getElementById(inputId).value;
      const cleanedUrl = cleanGoogleDocUrl(rawUrl);

      if (cleanedUrl) {
        set(ref(db, `portal/settings/${field}`), rawUrl)
          .then(() => alert(`${type.toUpperCase()} link saved globally!`))
          .catch(err => alert('Error saving link: ' + err.message));
      }
    };

    function processExcelData(data) {
      if (!currentUser || currentUser.isAnonymous) {
        alert('Unauthorized write attempt.');
        return;
      }
      const workbook = XLSX.read(data, { type: 'binary', raw: false, cellText: true });
      const sheetName = workbook.SheetNames[0];
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { raw: false, defval: "" });

      set(ref(db, 'portal/cards'), json)
        .then(() => alert('Cards uploaded & published live to Realtime DB!'))
        .catch(err => alert('Error uploading cards: ' + err.message));
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => processExcelData(evt.target.result);
      reader.readAsBinaryString(file);
    });

    document.getElementById('searchInput').addEventListener('input', filterCards);
    document.getElementById('sortSelect').addEventListener('change', filterCards);
    document.getElementById('setFilter').addEventListener('change', filterCards);
    document.getElementById('typeFilter').addEventListener('change', filterCards);
    document.getElementById('tagFilter').addEventListener('change', filterCards);

    window.addEventListener('DOMContentLoaded', () => {
      const savedTab = localStorage.getItem('activeTab');
      if (savedTab) {
        const btnMap = { 'cardsTab': 0, 'rulesTab': 1, 'loreTab': 2 };
        const tabBtns = document.querySelectorAll('.tab-btn');
        if (tabBtns[btnMap[savedTab]]) {
          switchTab(savedTab, tabBtns[btnMap[savedTab]]);
        }
      }
    });

    listenToRealtimeData();
  </script>
</body>
</html>
