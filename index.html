<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Ego Card Gallery</title>
  
  <!-- SheetJS for Excel Parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #0d0f14;
      --card-bg: #161922;
      --card-border: #262b3a;
      --text-main: #f0f2f5;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-danger: #ef4444;
      --domain-color: #a855f7;
      --item-color: #06b6d4;
      --buff-color: #10b981;
      --bane-color: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Navigation */
    .header { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px; 
      border-bottom: 1px solid var(--card-border); 
      margin-bottom: 20px; 
    }

    @media (min-width: 640px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { 
      padding: 10px 18px; 
      background-color: var(--accent-blue); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.9rem;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-danger { background-color: var(--accent-danger); }
    .btn-secondary { background-color: #334155; color: #cbd5e1; }

    /* Admin Management Panel */
    .admin-controls { 
      display: none; 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: 12px; 
      margin-bottom: 24px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    body.admin-mode .admin-controls { display: block; }
    .admin-controls h3 { margin-bottom: 8px; font-size: 1.1rem; color: #f1f5f9; }
    .admin-controls p { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 14px; }
    
    .upload-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .upload-box { flex-direction: row; align-items: center; }
    }

    /* Filter & Search Bar */
    .filter-bar { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 24px; 
    }
    @media (min-width: 640px) {
      .filter-bar { flex-direction: row; }
    }

    input[type="text"], input[type="file"], select { 
      padding: 12px 16px; 
      background: #1e2230; 
      border: 1px solid var(--card-border); 
      color: white; 
      border-radius: 8px; 
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent-blue); }
    input[type="text"] { flex-grow: 1; }

    /* Responsive Cards Grid */
    .gallery { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 16px; 
    }
    @media (min-width: 480px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 768px) { .gallery { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
    @media (min-width: 1024px) { .gallery { grid-template-columns: repeat(4, 1fr); } }

    /* Card Styling */
    .card { 
      background: var(--card-bg); 
      padding: 18px; 
      border-radius: 12px; 
      border: 1px solid var(--card-border); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { 
      transform: translateY(-3px); 
      border-color: #3b4259;
    }

    .card-header-type {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Card Type Badges */
    .card-type { 
      font-size: 0.75em; 
      font-weight: 700;
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      background: #2a2f42; 
      color: #94a3b8;
      padding: 4px 10px; 
      border-radius: 6px; 
    }
    .card-type.domain {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .card-type.item {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    /* Card Glow Effects */
    .card.domain-card {
      border-left: 4px solid var(--domain-color);
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.04) 0%, var(--card-bg) 100%);
    }

    .card h3 { 
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc; 
      margin-bottom: 8px;
    }

    /* Stats Grid (hidden for Domain Cards) */
    .card-stats { 
      display: flex;
      gap: 8px;
      margin: 12px 0; 
      font-size: 0.85rem;
    }
    .stat-pill {
      background: #222736;
      padding: 4px 8px;
      border-radius: 6px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Domain Cards Special Tag Bar */
    .domain-tag-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 10px 0;
      padding: 4px 10px;
      background: rgba(168, 85, 247, 0.12);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #d8b4fe;
    }

    .card-ability { 
      font-size: 0.9rem; 
      color: #cbd5e1; 
      line-height: 1.5; 
      margin-top: 6px;
    }

    /* Buff & Bane Text Styling */
    .buff-tag {
      color: var(--buff-color);
      font-weight: 700;
    }
    .bane-tag {
      color: var(--bane-color);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">Prime Ego Gallery</h1>
      <div class="btn-group">
        <button id="adminToggleBtn" class="btn btn-secondary">✏️ Admin Login</button>
        <button id="lockAdminBtn" class="btn btn-danger" style="display:none;">🔒 Logout</button>
      </div>
    </div>

    <!-- Admin Controls Panel -->
    <div id="adminPanel" class="admin-controls">
      <h3>Admin Management</h3>
      <p>Upload an Excel file (<code>.xlsx</code>) to replace all cards in the database:</p>
      <div class="upload-box">
        <input type="file" id="excelFileInput" accept=".xlsx, .xls" />
        <button id="importBtn" class="btn">Upload & Replace Database</button>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search by name or ability text..." />
      <select id="typeFilter">
        <option value="All">All Types</option>
      </select>
    </div>

    <!-- Cards Output Grid -->
    <div id="galleryGrid" class="gallery"></div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyBhGXBgEcVDihD3od5XGJB7mmBg7_Kxwt4",
      authDomain: "pego-a3b20.firebaseapp.com",
      databaseURL: "https://pego-a3b20-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pego-a3b20",
      storageBucket: "pego-a3b20.firebasestorage.app",
      messagingSenderId: "895990371588",
      appId: "1:895990371588:web:319ca9c8bbfc46f8db2c51"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const adminToggleBtn = document.getElementById("adminToggleBtn");
    const lockAdminBtn = document.getElementById("lockAdminBtn");
    const excelFileInput = document.getElementById("excelFileInput");
    const importBtn = document.getElementById("importBtn");
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const galleryGrid = document.getElementById("galleryGrid");

    let isAdmin = false;
    let allCards = [];

    // Monitor Firebase Auth State
    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        isAdmin = true;
        document.body.classList.add("admin-mode");
        adminToggleBtn.innerText = "🔓 Logged In (Admin)";
        lockAdminBtn.style.display = "inline-block";
      } else {
        isAdmin = false;
        document.body.classList.remove("admin-mode");
        adminToggleBtn.innerText = "✏️ Admin Login";
        lockAdminBtn.style.display = "none";
      }
    });

    // Admin Login Handler
    adminToggleBtn.addEventListener("click", async () => {
      if (isAdmin) return;
      const email = prompt("Enter Admin Email:");
      if (!email) return;
      const password = prompt("Enter Admin Password:");
      if (!password) return;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Logged in successfully!");
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });

    // Logout Handler
    lockAdminBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        alert("Logged out successfully.");
      } catch (err) {
        alert("Logout failed: " + err.message);
      }
    });

    // Helper: Safe numeric parsing to prevent NaN errors
    const safeNum = (val) => {
      const parsed = Number(val);
      return isNaN(parsed) ? 0 : parsed;
    };

    // Bulk Excel Import Logic
    importBtn.addEventListener("click", () => {
      const file = excelFileInput.files[0];
      if (!file) {
        alert("Please select an Excel file first.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet);

          const processedCards = rows.map((row, idx) => {
            const cost = safeNum(row.Cost);
            const hp = safeNum(row.HP);
            const power = safeNum(row.Power);
            const abilityText = String(row.Ability || "");
            const abilityLower = abilityText.toLowerCase();

            let cardType = row.Type ? String(row.Type).trim() : "Unknown";

            // Domain Classification Rule
            if (cardType.toLowerCase() === "domain" || (cost === 0 && hp === 0 && power === 0 && (abilityLower.includes("buff") || abilityLower.includes("bane")))) {
              cardType = "Domain";
            }

            return {
              id: row.ID ? String(row.ID) : `card_${idx}`,
              name: String(row.Name || "Untitled Card"),
              cost: cost,
              hp: hp,
              power: power,
              type: cardType,
              ability: abilityText
            };
          });

          await set(ref(db, "game_data"), processedCards);
          alert(`Successfully replaced database with ${processedCards.length} cards!`);
          excelFileInput.value = "";
        } catch (err) {
          alert("Import failed: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Realtime Database Sync
    onValue(ref(db, "game_data"), (snapshot) => {
      const data = snapshot.val();
      allCards = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
      updateTypeFilterOptions();
      renderGallery();
    });

    // Dynamic Filter Dropdown Options
    function updateTypeFilterOptions() {
      const currentSelected = typeFilter.value;
      const types = ["All", ...new Set(allCards.map(c => c.type).filter(Boolean))].sort();
      
      typeFilter.innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join("");
      if (types.includes(currentSelected)) {
        typeFilter.value = currentSelected;
      }
    }

    // Format Ability Text (Highlight Buff / Bane)
    function formatAbilityText(abilityText) {
      if (!abilityText) return "<em>No ability text</em>";
      return abilityText
        .replace(/\\/g, " ")
        .replace(/Buff:/gi, '<span class="buff-tag">Buff:</span>')
        .replace(/Bane:/gi, '<br><span class="bane-tag">Bane:</span>');
    }

    // Render Cards Gallery
    function renderGallery() {
      const query = searchInput.value.toLowerCase();
      const selectedType = typeFilter.value;

      const filtered = allCards.filter(card => {
        const matchesSearch = card.name.toLowerCase().includes(query) || card.ability.toLowerCase().includes(query);
        const matchesType = selectedType === "All" || card.type === selectedType;
        return matchesSearch && matchesType;
      });

      if (filtered.length === 0) {
        galleryGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No cards found.</p>`;
        return;
      }

      galleryGrid.innerHTML = filtered.map(card => {
        const isDomain = card.type === "Domain";
        const isItem = card.type === "Item";

        const badgeClass = isDomain ? "domain" : (isItem ? "item" : "");
        const cardClass = isDomain ? "card domain-card" : "card";

        return `
          <div class="${cardClass}">
            <div>
              <div class="card-header-type">
                <span class="card-type ${badgeClass}">${card.type}</span>
              </div>
              <h3>${card.name}</h3>

              ${isDomain ? `
                <div class="domain-tag-bar">🌌 Domain Card (Buff / Bane)</div>
              ` : `
                <div class="card-stats">
                  <span class="stat-pill">Cost: ${card.cost}</span>
                  <span class="stat-pill">HP: ${card.hp}</span>
                  <span class="stat-pill">Power: ${card.power}</span>
                </div>
              `}

              <div class="card-ability">${formatAbilityText(card.ability)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", renderGallery);
    typeFilter.addEventListener("change", renderGallery);
  </script>
</body>
</html>
