<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Ego Card Gallery</title>
  
  <!-- SheetJS for Excel Parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #e0e0e0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
    .btn { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn:hover { background-color: #0056b3; }
    .btn-danger { background-color: #dc3545; }
    .btn-danger:hover { background-color: #a71d2a; }
    .btn-secondary { background-color: #495057; }
    
    /* Admin Panel (Hidden by default) */
    .admin-controls { display: none; background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
    body.admin-mode .admin-controls { display: block; }
    
    /* Controls Area */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
    input[type="text"] { flex-grow: 1; }

    /* Cards Grid */
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { margin-top: 0; color: #ffca28; }
    .card-type { font-size: 0.85em; text-transform: uppercase; background: #333; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .card-stats { font-weight: bold; margin: 10px 0; color: #81d4fa; }
    .card-ability { font-size: 0.9em; color: #ccc; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Prime Ego Card Gallery</h1>
    <div>
      <button id="adminToggleBtn" class="btn btn-secondary">✏️ Admin Login</button>
      <button id="lockAdminBtn" class="btn btn-danger" style="display:none;">🔒 Logout</button>
    </div>
  </div>

  <!-- Admin Controls Panel -->
  <div id="adminPanel" class="admin-controls">
    <h3>Admin Management</h3>
    <p>Upload an Excel file (<code>.xlsx</code>) to wipe existing cards and perform a clean bulk import:</p>
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />
      <button id="importBtn" class="btn">Upload & Replace Database</button>
    </div>
  </div>

  <!-- Filter & Search Controls -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search cards by name or ability text..." />
    <select id="typeFilter">
      <option value="All">All Types</option>
      <option value="Domain">Domain</option>
      <option value="Item">Item</option>
    </select>
  </div>

  <!-- Cards Output Grid -->
  <div id="galleryGrid" class="gallery"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "pego-a3b20.firebaseapp.com",
      databaseURL: "https://pego-a3b20-default-rtdb.firebaseio.com",
      projectId: "pego-a3b20",
      storageBucket: "pego-a3b20.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // DOM Elements
    const adminToggleBtn = document.getElementById("adminToggleBtn");
    const lockAdminBtn = document.getElementById("lockAdminBtn");
    const adminPanel = document.getElementById("adminPanel");
    const excelFileInput = document.getElementById("excelFileInput");
    const importBtn = document.getElementById("importBtn");
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const galleryGrid = document.getElementById("galleryGrid");

    let isAdmin = false;
    let allCards = [];

    // Monitor Firebase Auth State
    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        isAdmin = true;
        document.body.classList.add("admin-mode");
        adminToggleBtn.innerText = "🔓 Logged In (Admin)";
        lockAdminBtn.style.display = "inline-block";
      } else {
        isAdmin = false;
        document.body.classList.remove("admin-mode");
        adminToggleBtn.innerText = "✏️ Admin Login";
        lockAdminBtn.style.display = "none";
      }
    });

    // Admin Login Click
    adminToggleBtn.addEventListener("click", async () => {
      if (isAdmin) return;
      const email = prompt("Enter Admin Email:");
      if (!email) return;
      const password = prompt("Enter Admin Password:");
      if (!password) return;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Logged in successfully!");
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });

    // Logout Click
    lockAdminBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        alert("Logged out successfully.");
      } catch (err) {
        alert("Logout failed: " + err.message);
      }
    });

    // Bulk Excel Import Logic
    importBtn.addEventListener("click", () => {
      const file = excelFileInput.files[0];
      if (!file) {
        alert("Please select an Excel file first.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet);

          const processedCards = rows.map((row, idx) => {
            const cost = Number(row.Cost || 0);
            const hp = Number(row.HP || 0);
            const power = Number(row.Power || 0);
            const abilityText = String(row.Ability || "").toLowerCase();

            let cardType = row.Type || "Unknown";

            // Domain Auto-Classification Rule
            if (cost === 0 && hp === 0 && power === 0 && (abilityText.includes("buff") || abilityText.includes("bane"))) {
              cardType = "Domain";
            }

            return {
              id: row.ID || `card_${idx}`,
              name: row.Name || "Untitled Card",
              cost: cost,
              hp: hp,
              power: power,
              type: cardType,
              ability: row.Ability || ""
            };
          });

          // Wipe & Replace DB Nodes
          await set(ref(db, "game_data"), processedCards);
          alert(`Successfully replaced database with ${processedCards.length} cards!`);
          excelFileInput.value = "";
        } catch (err) {
          alert("Import failed: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Realtime Database Sync
    onValue(ref(db, "game_data"), (snapshot) => {
      const data = snapshot.val();
      allCards = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
      renderGallery();
    });

    // UI Rendering & Filtering
    function renderGallery() {
      const query = searchInput.value.toLowerCase();
      const selectedType = typeFilter.value;

      const filtered = allCards.filter(card => {
        const matchesSearch = card.name.toLowerCase().includes(query) || card.ability.toLowerCase().includes(query);
        const matchesType = selectedType === "All" || card.type === selectedType;
        return matchesSearch && matchesType;
      });

      if (filtered.length === 0) {
        galleryGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">No cards found.</p>`;
        return;
      }

      galleryGrid.innerHTML = filtered.map(card => `
        <div class="card">
          <div>
            <span class="card-type">${card.type}</span>
            <h3>${card.name}</h3>
            <div class="card-stats">Cost: ${card.cost} | HP: ${card.hp} | Power: ${card.power}</div>
            <div class="card-ability">${card.ability || "<em>No ability text</em>"}</div>
          </div>
        </div>
      `).join("");
    }

    searchInput.addEventListener("input", renderGallery);
    typeFilter.addEventListener("change", renderGallery);
  </script>
</body>
</html>
